<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid-d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16181d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-d" cx="82%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="10%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="420" fill="#0a0a0c"/>
  <rect width="1600" height="420" fill="url(#grid-d)"/>
  <rect width="1600" height="420" fill="url(#glow-d)"/>

  <!-- abstract architecture linework, right side -->
  <g stroke="#242830" stroke-width="1" fill="none" opacity="0.9">
    <line x1="1180" y1="90" x2="1180" y2="330"/>
    <line x1="1180" y1="90" x2="1420" y2="90"/>
    <line x1="1180" y1="200" x2="1500" y2="200"/>
    <line x1="1180" y1="330" x2="1360" y2="330"/>
    <line x1="1420" y1="90" x2="1420" y2="200"/>
    <line x1="1500" y1="200" x2="1500" y2="270"/>
    <line x1="1360" y1="330" x2="1360" y2="270"/>
    <line x1="1360" y1="270" x2="1500" y2="270"/>
  </g>
  <g fill="#2f81f7">
    <circle cx="1180" cy="90" r="3"/>
    <circle cx="1180" cy="200" r="3"/>
    <circle cx="1180" cy="330" r="3"/>
    <circle cx="1420" cy="90" r="2.5" fill="#3a3f4a"/>
    <circle cx="1500" cy="200" r="2.5" fill="#3a3f4a"/>
    <circle cx="1360" cy="330" r="2.5" fill="#3a3f4a"/>
    <circle cx="1500" cy="270" r="2.5" fill="#3a3f4a"/>
    <circle cx="1360" cy="270" r="2.5" fill="#3a3f4a"/>
  </g>

  <!-- system metadata, top right -->
  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#4b5058" letter-spacing="1">
    <text x="1548" y="48" text-anchor="end">STATUS · ACTIVE</text>
    <text x="1548" y="66" text-anchor="end">ROLE · BACKEND / JAVA</text>
    <text x="1548" y="84" text-anchor="end">@0XSUNIL14</text>
  </g>

  <!-- top-left kicker -->
  <text x="72" y="92" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#2f81f7" letter-spacing="3">01 — PROFILE</text>

  <!-- name -->
  <text x="70" y="222" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="104" font-weight="700" fill="#f2f3f5" letter-spacing="-2">SUNIL PATIL</text>

  <!-- role -->
  <text x="74" y="270" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#8b8f98" letter-spacing="5">SOFTWARE ENGINEER</text>

  <!-- divider -->
  <line x1="74" y1="304" x2="234" y2="304" stroke="#2f81f7" stroke-width="2"/>

  <!-- stack metadata -->
  <text x="74" y="340" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#c9cdd3" letter-spacing="1">JAVA / SPRING BOOT / BACKEND</text>

