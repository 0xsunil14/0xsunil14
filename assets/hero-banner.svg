<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c2128" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="#0d1117"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <!-- outer border -->
  <rect x="1" y="1" width="1198" height="278" rx="10" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- terminal window -->
  <g transform="translate(56,48)">
    <rect x="0" y="0" width="1088" height="184" rx="8" fill="#0f1319" stroke="#21262d" stroke-width="1"/>
    <!-- title bar -->
    <rect x="0" y="0" width="1088" height="32" rx="8" fill="#141a21"/>
    <rect x="0" y="24" width="1088" height="8" fill="#141a21"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="16" r="5" fill="#febc2e"/>
    <circle cx="60" cy="16" r="5" fill="#28c840"/>
    <text x="544" y="20" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#6e7681">0xsunil14 — zsh</text>

    <!-- prompt line -->
    <text x="28" y="66" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#3fb950">sunil@0xsunil14</text>
    <text x="180" y="66" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#6e7681">:~$</text>
    <text x="215" y="66" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#c9d1d9">whoami</text>

    <!-- name -->
    <text x="28" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="1">SUNIL PATIL</text>
    <text x="330" y="108" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#8b949e">— Software Engineer</text>

    <!-- stack line -->
    <text x="28" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#58a6ff">Java</text>
    <text x="75" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#6e7681"> · </text>
    <text x="90" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#58a6ff">Spring Boot</text>
    <text x="192" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#6e7681"> · </text>
    <text x="207" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#58a6ff">Backend</text>
    <text x="285" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#6e7681"> · </text>
    <text x="300" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#58a6ff">React</text>

    <!-- description -->
    <text x="28" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6e7681">Building backend systems and full-stack web applications.</text>

    <!-- cursor -->
    <rect x="28" y="184" width="9" height="16" fill="#3fb950"/>
  </g>
</svg>
