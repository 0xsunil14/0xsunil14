  <text x="74" y="378" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6069">Building reliable software · Learning · Shipping</text>

  <!-- top/bottom edge shading -->
  <rect width="1600" height="420" fill="url(#edge-d)"/>

  <!-- frame -->
  <rect x="1" y="1" width="1598" height="418" fill="none" stroke="#1b1e24" stroke-width="1"/>
