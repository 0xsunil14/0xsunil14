<svg width="1700" height="460" viewBox="0 0 1700 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1700" height="460" fill="#131212"/>

  <!-- personal mark: overlapping monoline S / P, set large and faint as a signature watermark -->
  <g transform="translate(1180,-40)" opacity="0.5">
    <text x="0" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="480"
          fill="none" stroke="#4f6fa3" stroke-width="1.4">S</text>
    <text x="195" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="480"
          fill="none" stroke="#2c2b29" stroke-width="1.4">P</text>
  </g>

  <!-- identity -->
  <text x="100" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="1" fill="#f2efe9">SUNIL PATIL</text>

  <text x="103" y="266" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="3" fill="#948f87">SOFTWARE ENGINEER</text>

  <line x1="103" y1="294" x2="143" y2="294" stroke="#4f6fa3" stroke-width="2"/>
</svg>
